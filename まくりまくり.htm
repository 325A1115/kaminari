<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>まくりまくり</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Noto Sans JP', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
header { background: #1a2744; color: #fff; padding: 1rem; font-weight: 700; font-size: 1.2rem; }
.main { display: flex; flex: 1; overflow: hidden; }
.left-panel { width: 40%; padding: 20px; overflow-y: auto; background: #f8f9fa; border-right: 1px solid #ddd; }
.right-panel { width: 60%; padding: 20px; overflow-y: auto; background: #fff; display: flex; flex-direction: column; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
input, textarea, select { width: 100%; padding: 10px; border: 2px solid #d0d0d0; border-radius: 4px; font-family: inherit; }
input:focus, textarea:focus { border-color: #533483; outline: none; }
.btn-area { margin-top: 20px; display: flex; gap: 10px; }
.send-btn { background: linear-gradient(135deg,#0f3460,#533483,#e94560); color: #fff; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; font-weight: 700; flex: 1; }
.reset-btn { background: #666; color: #fff; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; }
.right-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
.output-content { flex: 1; white-space: pre-wrap; line-height: 1.6; }
.action-bar { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
.loading { display: none; color: #533483; font-weight: bold; margin: 10px 0; }
.retry-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
.modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 80%; max-width: 500px; }
@media(max-width:700px) { .main { flex-direction: column; } .left-panel, .right-panel { width: 100%; } }
</style>
</head>
<body>
<header>まくりまくり</header>
<div class="main">
    <div class="left-panel">
        <h2>入力項目</h2>
        <div class="form-group">
            <label>店舗名</label>
            <input type="text" id="shopName" placeholder="例：ラーメン二郎 三田本店">
        </div>
        <div class="form-group">
            <label>ラーメンの種類</label>
            <input type="text" id="ramenType" placeholder="例：小ラーメン">
        </div>
        <div class="form-group">
            <label>交換希望アイテム</label>
            <textarea id="exchangeItem" rows="3" placeholder="例：味玉、または無料トッピング券"></textarea>
        </div>
        <div class="btn-area">
            <button class="send-btn" onclick="sendRequest()">生成する</button>
            <button class="reset-btn" onclick="location.reload()">リセット</button>
        </div>
    </div>
    <div class="right-panel">
        <div class="right-header">
            <strong>AI 出力</strong>
            <div>
                <button onclick="copyOutput()">コピー</button>
                <button onclick="saveOutput()">保存</button>
            </div>
        </div>
        <div id="loading" class="loading">生成中...</div>
        <div id="output" class="output-content">ここにAIの回答が表示されます。</div>
        <div class="action-bar">
            <button onclick="showRetryPopup()">指示をして修正する</button>
        </div>
    </div>
</div>

<div id="retryModal" class="retry-modal">
    <div class="modal-content">
        <h3>修正指示</h3>
        <textarea id="retryInstruction" rows="3"></textarea>
        <div class="btn-area">
            <button onclick="submitRetry()">送信</button>
            <button onclick="closeRetryPopup()">閉じる</button>
        </div>
    </div>
</div>

<script>
let currentUid = '';
const API_URL = 'app_api.php';

function getVal(id) {
    const el = document.getElementById(id);
    return el.value.trim() || el.getAttribute('placeholder') || '';
}

async function doRequest(payload) {
    document.getElementById('loading').style.display = 'block';
    try {
        const res = await fetch(API_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.ok) {
            currentUid = data.uid;
            document.getElementById('output').innerHTML = renderMarkdown(data.answer);
        } else {
            alert('エラー: ' + data.error);
        }
    } catch (e) { alert('通信失敗'); }
    document.getElementById('loading').style.display = 'none';
}

function sendRequest() {
    const msg = `店舗名:${getVal('shopName')}\nラーメン:${getVal('ramenType')}\n交換希望:${getVal('exchangeItem')}`;
    doRequest({ message: msg });
}

function renderMarkdown(text) {
    let html = text.replace(/^### (.*$)/gim, '<h3>$1</h3>')
                   .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                   .replace(/\*\*(.*)\*\*/gim, '<b>$1</b>')
                   .replace(/\n/gim, '<br>');
    return DOMPurify.sanitize(html);
}

function copyOutput() { navigator.clipboard.writeText(document.getElementById('output').innerText); }
function saveOutput() {
    const blob = new Blob([document.getElementById('output').innerText], {type: 'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'output.txt'; a.click();
}
function showRetryPopup() { document.getElementById('retryModal').style.display = 'flex'; }
function closeRetryPopup() { document.getElementById('retryModal').style.display = 'none'; }
function submitRetry() {
    const instr = document.getElementById('retryInstruction').value;
    closeRetryPopup();
    doRequest({ utterance: instr, uid: currentUid });
}
</script>
</body>
</html>
